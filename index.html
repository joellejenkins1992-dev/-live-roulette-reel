<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Roulette Reel - NFL Fantasy Draft Order</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 15%, #243b5a 0%, #0b1422 45%, #03070c 100%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    min-height: 100vh;
    padding: 22px 14px 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: clamp(34px, 8vw, 62px);
    font-weight: 950;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.header p {
    margin: 8px 0 0;
    color: #9db0c7;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.card {
    width: min(900px, 100%);
    padding: 22px;
    border-radius: 25px;
    background: rgba(5, 13, 24, .9);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
}

.position {
    text-align: center;
    margin-bottom: 12px;
}

.position-label {
    color: #879bb4;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.position-number {
    font-size: 48px;
    font-weight: 950;
    line-height: 1;
    margin-top: 5px;
}

.wheel-container {
    width: min(540px, 90vw);
    aspect-ratio: 1;
    margin: 0 auto;
    position: relative;
}

.pointer {
    position: absolute;
    z-index: 20;
    top: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 42px solid #f6c84c;
    filter: drop-shadow(0 4px 5px #000);
}

.wheel {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 10px solid #cbd5df;
    background: #152238;
    box-shadow:
        0 0 0 5px #060b12,
        0 0 40px rgba(0,0,0,.8),
        inset 0 0 35px rgba(0,0,0,.8);
    overflow: hidden;
    transition: transform 5.5s cubic-bezier(.08,.7,.08,1);
}

.segment {
    position: absolute;
    left: 50%;
    top: 0;
    width: 50%;
    height: 50%;
    transform-origin: 0% 100%;
    overflow: hidden;
}

.segment-inner {
    position: absolute;
    width: 200%;
    height: 200%;
    left: -100%;
    top: 0;
    display: flex;
    justify-content: center;
    padding-top: 18px;
    text-align: center;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
}

.center {
    position: absolute;
    z-index: 15;
    width: 105px;
    height: 105px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #273b54, #060a10 72%);
    border: 7px solid #d7dee6;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: 950;
    font-size: 13px;
    letter-spacing: 1px;
    box-shadow: 0 0 25px rgba(0,0,0,.8);
}

.result {
    text-align: center;
    min-height: 105px;
    margin-top: 20px;
}

.result-label {
    color: #8195ae;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.result-name {
    margin-top: 6px;
    font-size: clamp(30px, 7vw, 55px);
    font-weight: 950;
    opacity: 0;
    transform: scale(.7);
}

.result-name.show {
    animation: reveal .7s cubic-bezier(.17,.84,.32,1.25) forwards;
}

@keyframes reveal {
    0% {
        opacity: 0;
        transform: scale(.7);
    }

    70% {
        opacity: 1;
        transform: scale(1.08);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 8px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 16px 34px;
    font-size: 16px;
    font-weight: 950;
    cursor: pointer;
}

.start {
    background: linear-gradient(135deg, #e11d48, #b91c1c);
    color: white;
    box-shadow: 0 10px 30px rgba(225,29,72,.3);
}

.start:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.reset {
    background: #1a293b;
    color: #d4dce6;
}

.board {
    margin-top: 25px;
}

.board-title {
    color: #8195ae;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
}

.picks {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

.pick {
    min-height: 68px;
    padding: 10px;
    border-radius: 11px;
    background: #0d1827;
    border: 1px solid #1d2b3d;
}

.pick.revealed {
    background: #132942;
    border-color: #55789d;
}

.pick-number-small {
    color: #60758e;
    font-size: 10px;
    text-transform: uppercase;
}

.pick-name {
    margin-top: 5px;
    font-size: 13px;
    font-weight: 850;
}

@media(max-width:600px) {
    .card {
        padding: 14px;
    }

    .picks {
        grid-template-columns: repeat(3, 1fr);
    }

    .center {
        width: 85px;
        height: 85px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <h1>Live Roulette Reel</h1>
        <p>NFL Fantasy Draft Order</p>
    </header>

    <main class="card">

        <div class="position">
            <div class="position-label">
                Draft Position
            </div>

            <div class="position-number" id="positionNumber">
                12
            </div>
        </div>

        <div class="wheel-container">

            <div class="pointer"></div>

            <div class="wheel" id="wheel"></div>

            <div class="center">
                LIVE<br>ROULETTE
            </div>

        </div>

        <div class="result">

            <div class="result-label">
                Selected Team
            </div>

            <div class="result-name" id="resultName">
                —
            </div>

        </div>

        <div class="buttons">

            <button
                class="start"
                id="startButton">
                START
            </button>

            <button
                class="reset"
                id="resetButton">
                RESET
            </button>

        </div>

        <section class="board">

            <div class="board-title">
                NFL Fantasy Draft Order
            </div>

            <div class="picks" id="picks"></div>

        </section>

    </main>

</div>


<script>

/*
===========================================================
YOUR DRAFT ORDER
===========================================================

PUT YOUR 12 TEAMS IN THE EXACT ORDER YOU WANT THEM
TO APPEAR IN THE FINAL DRAFT.

Example:

Index 0 = Pick 1
Index 1 = Pick 2
...
Index 7 = Pick 8

Joey is currently Pick 8 in this example.
CHANGE THE OTHER NAMES.
===========================================================
*/

const PRESET_ORDER = [
    "Blue Wolf",      // Pick 1
    "Denton",      // Pick 2
    "Griga",      // Pick 3
    "Otto",      // Pick 4
    "Twin",      // Pick 5
    "Myro",      // Pick 6
    "Eli",      // Pick 7
    "Joey",        // Pick 8
    "Ling",      // Pick 9
    "Yellow",     // Pick 10
    "Les",     // Pick 11
    "Papi"      // Pick 12
];


/*
===========================================================
APP
===========================================================
*/

let currentPick = 12;
let spinning = false;
let remainingTeams = [...PRESET_ORDER];
let rotation = 0;

const wheel = document.getElementById("wheel");
const startButton = document.getElementById("startButton");
const resetButton = document.getElementById("resetButton");
const resultName = document.getElementById("resultName");
const positionNumber = document.getElementById("positionNumber");
const picks = document.getElementById("picks");


/*
CREATE DRAFT BOARD
*/

function createBoard() {

    picks.innerHTML = "";

    for (let i = 12; i >= 1; i--) {

        const box = document.createElement("div");

        box.className = "pick";
        box.id = "pick-" + i;

        box.innerHTML = `
            <div class="pick-number-small">
                Pick ${i}
            </div>

            <div class="pick-name">
                —
            </div>
        `;

        picks.appendChild(box);
    }
}


/*
CREATE ROULETTE WHEEL
*/

function createWheel() {

    wheel.innerHTML = "";

    const count = remainingTeams.length;

    if (!count) return;

    const angle = 360 / count;

    remainingTeams.forEach((team, index) => {

        const segment = document.createElement("div");

        segment.className = "segment";

        segment.style.transform =
            `rotate(${index * angle}deg) skewY(${90 - angle}deg)`;

        const inner = document.createElement("div");

        inner.className = "segment-inner";

        inner.style.transform =
            `rotate(${angle / 2}deg) skewY(-${90 - angle}deg)`;

        inner.textContent = team;

        segment.appendChild(inner);

        wheel.appendChild(segment);
    });
}


/*
START
*/

startButton.addEventListener("click", startRoulette);

function startRoulette() {

    if (spinning || remainingTeams.length === 0) {
        return;
    }

    spinning = true;
    startButton.disabled = true;

    resultName.classList.remove("show");
    resultName.textContent = "—";

    /*
    The next team comes from your configured
    draft-order list.
    */

    const selectedTeam =
        PRESET_ORDER[currentPick - 1];

    const winnerIndex =
        remainingTeams.indexOf(selectedTeam);

    const count = remainingTeams.length;

    const segmentAngle = 360 / count;

    /*
    Point the selected segment toward
    the pointer at the top.
    */

    const target =
        360 -
        (winnerIndex * segmentAngle) -
        (segmentAngle / 2);

    const fullSpins =
        6 + Math.floor(Math.random() * 3);

    rotation +=
        fullSpins * 360 +
        target;

    wheel.style.transform =
        `rotate(${rotation}deg)`;


    /*
    Wait for the wheel animation.
    */

    setTimeout(() => {

        resultName.textContent =
            selectedTeam;

        resultName.classList.add("show");

        showPick(
            currentPick,
            selectedTeam
        );

        remainingTeams =
            remainingTeams.filter(
                team => team !== selectedTeam
            );

        currentPick--;

        if (currentPick > 0) {

            positionNumber.textContent =
                currentPick;

            createWheel();

            startButton.disabled = false;

        } else {

            positionNumber.textContent =
                "DONE";

            startButton.textContent =
                "COMPLETE";

        }

        spinning = false;

    }, 5700);
}


/*
SHOW PICK
*/

function showPick(position, team) {

    const box =
        document.getElementById(
            "pick-" + position
        );

    if (!box) return;

    box.classList.add("revealed");

    box.querySelector(".pick-name")
        .textContent = team;
}


/*
RESET
*/

resetButton.addEventListener("click", reset);

function reset() {

    if (spinning) return;

    currentPick = 12;

    remainingTeams = [...PRESET_ORDER];

    rotation = 0;

    wheel.style.transform =
        "rotate(0deg)";

    resultName.textContent = "—";

    resultName.classList.remove("show");

    positionNumber.textContent = "12";

    startButton.disabled = false;

    startButton.textContent = "START";

    createBoard();
    createWheel();
}


/*
INITIALIZE
*/

createBoard();
createWheel();

</script>

</body>
</html>
