<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Roulette Reel - NFL Fantasy Draft Order</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 15%, #253d5c 0%, #0b1421 45%, #02060b 100%);
    overflow-x: hidden;
}

.app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 14px 50px;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: clamp(32px, 8vw, 60px);
    font-weight: 950;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.header p {
    margin: 8px 0 0;
    color: #9db0c7;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.card {
    width: min(900px, 100%);
    padding: 22px;
    border-radius: 26px;
    background: rgba(5, 13, 24, .92);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
}

.position {
    text-align: center;
    margin-bottom: 15px;
}

.position-label {
    color: #8da2ba;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.position-number {
    margin-top: 4px;
    font-size: 48px;
    font-weight: 950;
}


/* =================================
   LOTTERY MACHINE
================================= */

.machine {
    position: relative;
    width: min(540px, 94vw);
    height: 470px;
    margin: 0 auto;
}


/* Glass globe */

.globe {
    position: absolute;
    left: 50%;
    top: 15px;
    transform: translateX(-50%);

    width: 410px;
    height: 360px;

    border-radius: 50% 50% 45% 45%;

    background:
        radial-gradient(
            circle at 35% 25%,
            rgba(255,255,255,.22),
            rgba(255,255,255,.05) 25%,
            rgba(15,30,45,.18) 55%,
            rgba(0,0,0,.55) 100%
        );

    border: 7px solid rgba(205,216,225,.85);

    box-shadow:
        inset 0 0 40px rgba(255,255,255,.08),
        0 0 0 5px #060b11,
        0 15px 45px rgba(0,0,0,.7);

    overflow: hidden;
}


/* Glass reflection */

.globe::before {
    content: "";
    position: absolute;
    left: 45px;
    top: 35px;

    width: 100px;
    height: 180px;

    border-radius: 50%;

    background: rgba(255,255,255,.08);

    transform: rotate(25deg);

    pointer-events: none;
}


/* Balls */

.balls {
    position: absolute;
    inset: 20px;

    overflow: hidden;
}


.ball {
    position: absolute;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 5px;

    font-size: 9px;
    font-weight: 950;

    color: #101820;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffffff,
            #f2f2f2 55%,
            #c7cdd2 100%
        );

    border: 2px solid #b8c0c7;

    box-shadow:
        inset -7px -8px 10px rgba(0,0,0,.12),
        0 4px 7px rgba(0,0,0,.4);

    transition:
        left .35s ease,
        top .35s ease,
        transform .35s ease;
}


/* Selected ball */

.ball.selected {
    z-index: 50;

    transform:
        scale(1.55);

    box-shadow:
        0 0 0 5px #f5c84b,
        0 0 35px #f5c84b,
        0 10px 25px rgba(0,0,0,.7);
}


/* Machine base */

.machine-base {
    position: absolute;

    left: 50%;
    bottom: 5px;

    transform: translateX(-50%);

    width: 360px;
    height: 105px;

    border-radius: 35px 35px 15px 15px;

    background:
        linear-gradient(
            180deg,
            #25394e,
            #0d1825
        );

    border: 5px solid #7d8d9d;

    box-shadow:
        0 15px 35px rgba(0,0,0,.7);
}


/* Machine slot */

.machine-base::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 17px;

    transform: translateX(-50%);

    width: 190px;
    height: 13px;

    border-radius: 10px;

    background: #05090d;

    box-shadow:
        inset 0 0 8px #000;
}


/* Feet */

.machine-base::after {
    content: "";

    position: absolute;

    left: 35px;
    right: 35px;
    bottom: -17px;

    height: 20px;

    border-radius: 0 0 15px 15px;

    background: #070d14;
}


/* Selection light */

.selection-light {

    position: absolute;

    z-index: 40;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 105px;
    height: 105px;

    border-radius: 50%;

    border: 3px solid rgba(255,255,255,.15);

    pointer-events: none;
}

.selection-light.active {

    animation:
        lightPulse .5s infinite alternate;
}

@keyframes lightPulse {

    from {
        box-shadow:
            0 0 5px rgba(255,255,255,.1);
    }

    to {
        box-shadow:
            0 0 35px #f5c84b;
    }
}


/* =================================
   RESULT
================================= */

.result {

    text-align: center;

    min-height: 105px;

    margin-top: 8px;
}

.result-label {

    color: #8397af;

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;
}

.result-name {

    margin-top: 6px;

    font-size: clamp(32px, 8vw, 58px);

    font-weight: 950;

    opacity: 0;

    transform: scale(.5);
}

.result-name.show {

    animation:
        resultReveal .8s cubic-bezier(.17,.84,.32,1.25)
        forwards;
}

@keyframes resultReveal {

    0% {
        opacity: 0;
        transform: scale(.5);
    }

    65% {
        opacity: 1;
        transform: scale(1.12);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}


/* =================================
   BUTTONS
================================= */

.buttons {

    display: flex;

    justify-content: center;

    gap: 12px;

    margin-top: 5px;
}

button {

    border: none;

    border-radius: 12px;

    padding: 16px 38px;

    font-size: 16px;

    font-weight: 950;

    cursor: pointer;
}

.start {

    color: white;

    background:
        linear-gradient(
            135deg,
            #ed1b2f,
            #a90e1e
        );

    box-shadow:
        0 10px 30px rgba(225,29,47,.3);
}

.start:disabled {

    opacity: .45;

    cursor: not-allowed;
}

.reset {

    color: #d4dce6;

    background:
        linear-gradient(
            135deg,
            #273a4e,
            #162434
        );
}


/* =================================
   DRAFT BOARD
================================= */

.board {

    margin-top: 28px;
}

.board-title {

    color: #8397af;

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 10px;
}

.picks {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 9px;
}

.pick {

    min-height: 68px;

    padding: 10px;

    border-radius: 11px;

    background: #0d1827;

    border:
        1px solid #1d2b3d;
}

.pick.revealed {

    background:
        linear-gradient(
            145deg,
            #193552,
            #10253b
        );

    border-color:
        #6386aa;
}

.pick-number-small {

    color: #60758e;

    font-size: 10px;

    text-transform: uppercase;
}

.pick-name {

    margin-top: 5px;

    font-size: 13px;

    font-weight: 850;
}


/* MOBILE */

@media(max-width:600px) {

    .card {
        padding: 14px;
    }

    .globe {

        width: 330px;
        height: 300px;
    }

    .ball {

        width: 52px;
        height: 52px;

        font-size: 7px;
    }

    .machine-base {

        width: 300px;
    }

    .picks {

        grid-template-columns:
            repeat(3, 1fr);
    }
}

</style>
</head>


<body>

<div class="app">


<header class="header">

    <h1>
        Live Roulette Reel
    </h1>

    <p>
        NFL Fantasy Draft Order
    </p>

</header>


<main class="card">


<div class="position">

    <div class="position-label">
        Draft Position
    </div>

    <div
        class="position-number"
        id="positionNumber">

        12

    </div>

</div>


<div class="machine">

    <div class="globe">

        <div
            class="balls"
            id="balls">
        </div>

    </div>


    <div
        class="selection-light"
        id="selectionLight">
    </div>


    <div class="machine-base"></div>

</div>


<div class="result">

    <div class="result-label">
        Selected Team
    </div>

    <div
        class="result-name"
        id="resultName">

        —

    </div>

</div>


<div class="buttons">

    <button
        class="start"
        id="startButton">

        START

    </button>


    <button
        class="reset"
        id="resetButton">

        RESET

    </button>

</div>


<section class="board">

    <div class="board-title">
        NFL Fantasy Draft Order
    </div>

    <div
        class="picks"
        id="picks">
    </div>

</section>


</main>

</div>


<script>


/*
========================================
YOUR DRAFT ORDER
========================================
*/

const PRESET_ORDER = [

    "Blue Wolf",
    "Denton",
    "Griga",
    "Otto",
    "Twin",
    "Myro",
    "Eli",
    "Joey",
    "Ling",
    "Yellow",
    "Les",
    "Papi"

];


let currentPick = 12;

let remainingTeams =
    [...PRESET_ORDER];

let spinning = false;


const balls =
    document.getElementById("balls");

const resultName =
    document.getElementById("resultName");

const positionNumber =
    document.getElementById("positionNumber");

const startButton =
    document.getElementById("startButton");

const resetButton =
    document.getElementById("resetButton");

const selectionLight =
    document.getElementById("selectionLight");

const picks =
    document.getElementById("picks");


/*
========================================
CREATE BALLS
========================================
*/

function createBalls() {

    balls.innerHTML = "";

    const count =
        remainingTeams.length;


    remainingTeams.forEach(
        (team, index) => {

            const ball =
                document.createElement("div");

            ball.className =
                "ball";

            ball.textContent =
                team;

            ball.dataset.team =
                team;


            const position =
                getBallPosition(
                    index,
                    count
                );


            ball.style.left =
                position.x + "%";

            ball.style.top =
                position.y + "%";


            balls.appendChild(ball);

        }
    );

}


/*
========================================
BALL POSITIONS
========================================
*/

function getBallPosition(
    index,
    count
) {

    /*
    Spread balls in several rows
    inside the glass globe.
    */

    const columns =
        Math.min(
            4,
            Math.max(
                2,
                Math.ceil(
                    Math.sqrt(count)
                )
            )
        );


    const row =
        Math.floor(index / columns);

    const column =
        index % columns;


    const rows =
        Math.ceil(
            count / columns
        );


    const x =
        8 +
        column *
        (84 / Math.max(1, columns - 1));


    const y =
        10 +
        row *
        (72 / Math.max(1, rows - 1));


    return {
        x: Math.min(x, 88),
        y: Math.min(y, 82)
    };

}


/*
========================================
DRAFT BOARD
========================================
*/

function createBoard() {

    picks.innerHTML = "";


    for (
        let i = 12;
        i >= 1;
        i--
    ) {

        const box =
            document.createElement("div");

        box.className =
            "pick";

        box.id =
            "pick-" + i;


        box.innerHTML = `

            <div class="pick-number-small">
                Pick ${i}
            </div>

            <div class="pick-name">
                —
            </div>

        `;


        picks.appendChild(box);

    }

}


/*
========================================
START
========================================
*/

startButton.addEventListener(
    "click",
    startLottery
);


function startLottery() {

    if (
        spinning ||
        remainingTeams.length === 0
    ) {
        return;
    }


    spinning = true;

    startButton.disabled =
        true;


    resultName.classList.remove(
        "show"
    );

    resultName.textContent =
        "—";


    /*
    Predetermined selection for
    this draft position.
    */

    const selectedTeam =
        PRESET_ORDER[
            currentPick - 1
        ];


    const allBalls =
        [...document.querySelectorAll(".ball")];


    selectionLight.classList.add(
        "active"
    );


    /*
    Rapidly scramble the balls.
    */

    let shuffleCount = 0;


    const shuffle =
        setInterval(() => {

            allBalls.forEach(
                ball => {

                    ball.style.left =
                        (5 +
                        Math.random() * 80)
                        + "%";

                    ball.style.top =
                        (5 +
                        Math.random() * 75)
                        + "%";

                    ball.style.transform =
                        `rotate(
                            ${Math.random() * 360}deg
                        )`;

                }
            );


            shuffleCount++;


            if (
                shuffleCount >= 13
            ) {

                clearInterval(
                    shuffle
                );

                revealBall(
                    selectedTeam
                );

            }

        }, 180);

}


/*
========================================
REVEAL SELECTED BALL
========================================
*/

function revealBall(
    selectedTeam
) {

    const selected =
        document.querySelector(
            `.ball[data-team="${CSS.escape(selectedTeam)}"]`
        );


    if (!selected) {

        finishSelection(
            selectedTeam
        );

        return;
    }


    /*
    Move selected ball toward
    the center.
    */

    selected.style.left =
        "50%";

    selected.style.top =
        "45%";

    selected.style.transform =
        "translate(-50%, -50%) scale(1.45)";


    setTimeout(() => {

        selected.classList.add(
            "selected"
        );


        setTimeout(() => {

            finishSelection(
                selectedTeam
            );

        }, 900);


    }, 600);

}


/*
========================================
FINISH
========================================
*/

function finishSelection(
    selectedTeam
) {

    selectionLight.classList.remove(
        "active"
    );


    resultName.textContent =
        selectedTeam;


    resultName.classList.add(
        "show"
    );


    const box =
        document.getElementById(
            "pick-" + currentPick
        );


    if (box) {

        box.classList.add(
            "revealed"
        );

        box.querySelector(
            ".pick-name"
        ).textContent =
            selectedTeam;

    }


    remainingTeams =
        remainingTeams.filter(
            team =>
                team !== selectedTeam
        );


    currentPick--;


    if (currentPick > 0) {

        positionNumber.textContent =
            currentPick;


        setTimeout(() => {

            createBalls();

            startButton.disabled =
                false;

        }, 500);

    } else {

        positionNumber.textContent =
            "DONE";

        startButton.textContent =
            "COMPLETE";

    }


    spinning = false;

}


/*
========================================
RESET
========================================
*/

resetButton.addEventListener(
    "click",
    resetLottery
);


function resetLottery() {

    if (spinning) return;


    currentPick = 12;


    remainingTeams =
        [...PRESET_ORDER];


    resultName.textContent =
        "—";


    resultName.classList.remove(
        "show"
    );


    positionNumber.textContent =
        "12";


    startButton.disabled =
        false;


    startButton.textContent =
        "START";


    selectionLight.classList.remove(
        "active"
    );


    createBoard();

    createBalls();

}


/*
========================================
INITIALIZE
========================================
*/

createBoard();

createBalls();

</script>

</body>
</html>
