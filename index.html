<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Draft Order</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b1020;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .app {
        width: 100%;
        max-width: 900px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 25px;
    }

    h1 {
        font-size: clamp(32px, 7vw, 60px);
        margin: 0 0 12px;
        text-align: center;
    }

    .subtitle {
        color: #aab3c5;
        font-size: 18px;
        margin-bottom: 35px;
        text-align: center;
    }

    button {
        border: none;
        border-radius: 14px;
        padding: 17px 42px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        background: white;
        color: #0b1020;
        transition: transform 0.15s;
    }

    button:hover {
        transform: scale(1.04);
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    #game {
        display: none;
        width: 100%;
        height: 100vh;
        position: relative;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    #ballArea {
        position: relative;
        width: min(90vw, 700px);
        height: min(65vh, 500px);
        overflow: hidden;
    }

    .ball {
        position: absolute;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: white;
        color: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 12px;
        font-weight: bold;
        padding: 7px;
        box-shadow:
            0 7px 15px rgba(0,0,0,.35),
            inset -5px -5px 10px rgba(0,0,0,.12);
        user-select: none;
        transition: left .15s linear, top .15s linear;
    }

    #result {
        display: none;
        text-align: center;
        z-index: 10;
    }

    #pickNumber {
        color: #aab3c5;
        font-size: 20px;
        margin-bottom: 8px;
    }

    #winner {
        font-size: clamp(42px, 10vw, 80px);
        font-weight: 900;
        margin-bottom: 30px;
    }

    #nextButton {
        display: none;
    }

    #complete {
        display: none;
        text-align: center;
    }

    #complete h2 {
        font-size: 42px;
        margin-bottom: 25px;
    }

    .final-order {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 25px;
    }

    .pick {
        background: rgba(255,255,255,.08);
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 18px;
    }
</style>
</head>

<body>

<div class="app">

    <!-- CLEAN OPENING SCREEN -->
    <div id="startScreen">
        <h1>Fantasy Draft Order</h1>
        <div class="subtitle">Ready to determine the draft order?</div>
        <button onclick="startDraft()">Start Draft</button>
    </div>

    <!-- LOTTERY -->
    <div id="game">

        <div id="ballArea"></div>

        <div id="result">
            <div id="pickNumber"></div>
            <div id="winner"></div>
            <button id="nextButton" onclick="nextPick()">Next Pick</button>
        </div>

        <div id="complete">
            <h2>Draft Order Complete</h2>
            <div class="final-order" id="finalOrder"></div>
            <button onclick="location.reload()">Restart</button>
        </div>

    </div>

</div>

<script>

/*
====================================================
DRAFT NAMES
====================================================
Replace these names with your actual league members.
*/

const players = [
    "Blue Wolf",
    "Joey",
    "Player 3",
    "Player 4",
    "Player 5",
    "Player 6",
    "Player 7",
    "Player 8",
    "Player 9",
    "Player 10",
    "Player 11",
    "Player 12"
];


/*
====================================================
HIDDEN DRAFT ORDER
====================================================

This determines the actual result.

The website DOES NOT display this order.

Change the names below to whatever order you want.

Example:
If Joey must be 8th, Joey goes in position 8.
*/

const predeterminedOrder = [
    "Blue Wolf",
    "Player 3",
    "Player 5",
    "Player 9",
    "Player 4",
    "Player 11",
    "Player 6",
    "Joey",
    "Player 10",
    "Player 12",
    "Player 7",
    "Player 8"
];


/*
====================================================
GAME VARIABLES
====================================================
*/

let remainingPlayers = [];
let currentPick = 0;
let balls = [];
let animationTimer = null;


/*
====================================================
START DRAFT
====================================================
*/

function startDraft() {

    document.getElementById("startScreen").style.display = "none";

    document.getElementById("game").style.display = "flex";

    remainingPlayers = [...players];

    currentPick = 0;

    createBalls();
}


/*
====================================================
CREATE BALLS
====================================================
*/

function createBalls() {

    const area = document.getElementById("ballArea");

    area.innerHTML = "";

    balls = [];

    remainingPlayers.forEach((name, index) => {

        const ball = document.createElement("div");

        ball.className = "ball";

        ball.textContent = name;

        ball.style.left =
            Math.random() * (area.clientWidth - 75) + "px";

        ball.style.top =
            Math.random() * (area.clientHeight - 75) + "px";

        area.appendChild(ball);

        balls.push({
            element: ball,
            name: name,
            x: parseFloat(ball.style.left),
            y: parseFloat(ball.style.top),
            dx: (Math.random() - .5) * 8,
            dy: (Math.random() - .5) * 8
        });
    });

    animateBalls();

    setTimeout(() => {

        clearInterval(animationTimer);

        drawWinner();

    }, 3000);
}


/*
====================================================
BALL ANIMATION
====================================================
*/

function animateBalls() {

    const area = document.getElementById("ballArea");

    clearInterval(animationTimer);

    animationTimer = setInterval(() => {

        balls.forEach(ball => {

            ball.x += ball.dx;
            ball.y += ball.dy;

            if (
                ball.x <= 0 ||
                ball.x >= area.clientWidth - 72
            ) {
                ball.dx *= -1;
            }

            if (
                ball.y <= 0 ||
                ball.y >= area.clientHeight - 72
            ) {
                ball.dy *= -1;
            }

            ball.element.style.left = ball.x + "px";
            ball.element.style.top = ball.y + "px";

        });

    }, 30);
}


/*
====================================================
DRAW WINNER
====================================================
*/

function drawWinner() {

    const winnerName = predeterminedOrder[currentPick];

    const winningBall = balls.find(
        ball => ball.name === winnerName
    );

    if (!winningBall) {
        alert("Error: Winner was not found in the remaining balls.");
        return;
    }

    /*
    Make the winning ball move toward
    the center before revealing it.
    */

    const area = document.getElementById("ballArea");

    winningBall.element.style.left =
        (area.clientWidth / 2 - 36) + "px";

    winningBall.element.style.top =
        (area.clientHeight / 2 - 36) + "px";

    setTimeout(() => {

        area.style.display = "none";

        document.getElementById("result").style.display = "block";

        document.getElementById("pickNumber").textContent =
            "Pick " + (currentPick + 1);

        document.getElementById("winner").textContent =
            winnerName;

        if (currentPick < predeterminedOrder.length - 1) {

            document.getElementById("nextButton").style.display =
                "inline-block";

        } else {

            document.getElementById("nextButton").style.display =
                "none";

            setTimeout(showComplete, 2500);

        }

    }, 1000);
}


/*
====================================================
NEXT PICK
====================================================
*/

function nextPick() {

    const winnerName = predeterminedOrder[currentPick];

    remainingPlayers =
        remainingPlayers.filter(
            player => player !== winnerName
        );

    currentPick++;

    document.getElementById("result").style.display = "none";

    document.getElementById("ballArea").style.display = "block";

    createBalls();
}


/*
====================================================
FINISH
====================================================
*/

function showComplete() {

    const result = document.getElementById("result");

    result.style.display = "none";

    const complete = document.getElementById("complete");

    complete.style.display = "block";

    const finalOrder =
        document.getElementById("finalOrder");

    finalOrder.innerHTML = "";

    predeterminedOrder.forEach((name, index) => {

        const row = document.createElement("div");

        row.className = "pick";

        row.textContent =
            (index + 1) + ". " + name;

        finalOrder.appendChild(row);

    });
}

</script>

</body>
</html>
