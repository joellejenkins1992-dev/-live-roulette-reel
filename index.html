<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Draft Order</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b1020;
    color: white;
    overflow: hidden;
}

#app {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* START SCREEN */

#startScreen {
    text-align: center;
}

h1 {
    font-size: clamp(38px, 8vw, 64px);
    margin: 0 0 12px;
}

.subtitle {
    color: #aab3c5;
    font-size: 18px;
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 12px;
    padding: 16px 34px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    background: white;
    color: #0b1020;
}

button:hover {
    transform: scale(1.03);
}

.resetButton {
    background: #30394f;
    color: white;
}

/* GAME */

#game {
    display: none;
    width: 100%;
    min-height: 100vh;
    position: relative;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#ballArea {
    position: relative;
    width: min(90vw, 760px);
    height: min(65vh, 520px);
}

/* BALLS */

.ball {
    position: absolute;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: white;
    color: #111827;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 6px;
    font-size: 12px;
    font-weight: bold;
    box-shadow:
        0 8px 18px rgba(0,0,0,.4),
        inset -5px -5px 10px rgba(0,0,0,.12);
    user-select: none;
}

/* RESULT */

#result {
    display: none;
    text-align: center;
}

#pickNumber {
    font-size: 22px;
    color: #aab3c5;
    margin-bottom: 8px;
}

#winner {
    font-size: clamp(45px, 11vw, 85px);
    font-weight: 900;
    margin-bottom: 30px;
}

#nextButton {
    display: none;
}

/* COMPLETE */

#complete {
    display: none;
    text-align: center;
}

#complete h2 {
    font-size: 40px;
    margin-bottom: 25px;
}

.finalOrder {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 25px;
}

.pick {
    background: rgba(255,255,255,.08);
    border-radius: 9px;
    padding: 9px 25px;
    font-size: 18px;
}
</style>
</head>

<body>

<div id="app">

    <!-- CLEAN OPENING SCREEN -->
    <div id="startScreen">

        <h1>Fantasy Draft Order</h1>

        <div class="subtitle">
            Ready to determine the draft order?
        </div>

        <div class="buttons">

            <button onclick="startDraft()">
                Start Draft
            </button>

            <button class="resetButton" onclick="resetDraft()">
                Reset
            </button>

        </div>

    </div>


    <!-- GAME -->

    <div id="game">

        <div id="ballArea"></div>

        <div id="result">

            <div id="pickNumber"></div>

            <div id="winner"></div>

            <button id="nextButton" onclick="nextPick()">
                Next Pick
            </button>

        </div>


        <div id="complete">

            <h2>Draft Order Complete</h2>

            <div class="finalOrder" id="finalOrder"></div>

            <button onclick="resetDraft()">
                Reset
            </button>

        </div>

    </div>

</div>


<script>

/*
====================================================
YOUR LEAGUE MEMBERS
====================================================
*/

const players = [
    "Blue Wolf",
    "Denton",
    "Griga",
    "Otto",
    "Twin",
    "Myro",
    "Eli",
    "Joey",
    "Ling",
    "Yellow",
    "Les",
    "Papi"
];


/*
====================================================
PREDETERMINED ORDER
====================================================

THIS IS HIDDEN FROM THE USER.

The website will reveal these names one at a time.
*/

const predeterminedOrder = [
    "Blue Wolf",
    "Denton",
    "Griga",
    "Otto",
    "Twin",
    "Myro",
    "Eli",
    "Joey",
    "Ling",
    "Yellow",
    "Les",
    "Papi"
];


let remainingPlayers = [];
let currentPick = 0;
let balls = [];
let animationTimer = null;
let drawTimeout = null;


/*
====================================================
START
====================================================
*/

function startDraft() {

    document.getElementById("startScreen").style.display = "none";

    document.getElementById("game").style.display = "flex";

    document.getElementById("complete").style.display = "none";

    document.getElementById("result").style.display = "none";

    remainingPlayers = [...players];

    currentPick = 0;

    createBalls();
}


/*
====================================================
CREATE BALLS
====================================================
*/

function createBalls() {

    const area = document.getElementById("ballArea");

    area.innerHTML = "";

    area.style.display = "block";

    balls = [];

    remainingPlayers.forEach(name => {

        const ball = document.createElement("div");

        ball.className = "ball";

        ball.textContent = name;

        const x =
            Math.random() *
            Math.max(1, area.clientWidth - 76);

        const y =
            Math.random() *
            Math.max(1, area.clientHeight - 76);

        ball.style.left = x + "px";
        ball.style.top = y + "px";

        area.appendChild(ball);

        balls.push({

            element: ball,

            name: name,

            x: x,

            y: y,

            dx: (Math.random() - 0.5) * 8,

            dy: (Math.random() - 0.5) * 8

        });

    });

    animateBalls();

    drawTimeout = setTimeout(drawWinner, 3500);
}


/*
====================================================
ANIMATE BALLS
====================================================
*/

function animateBalls() {

    clearInterval(animationTimer);

    const area = document.getElementById("ballArea");

    animationTimer = setInterval(() => {

        balls.forEach(ball => {

            ball.x += ball.dx;
            ball.y += ball.dy;

            if (
                ball.x <= 0 ||
                ball.x >= area.clientWidth - 76
            ) {
                ball.dx *= -1;
            }

            if (
                ball.y <= 0 ||
                ball.y >= area.clientHeight - 76
            ) {
                ball.dy *= -1;
            }

            ball.element.style.left =
                ball.x + "px";

            ball.element.style.top =
                ball.y + "px";

        });

    }, 30);
}


/*
====================================================
DRAW WINNER
====================================================
*/

function drawWinner() {

    clearInterval(animationTimer);

    const winnerName =
        predeterminedOrder[currentPick];

    const winningBall =
        balls.find(ball => ball.name === winnerName);

    if (!winningBall) {
        alert("Something went wrong finding the selected ball.");
        return;
    }

    const area =
        document.getElementById("ballArea");

    /*
    Move selected ball to center
    */

    winningBall.element.style.left =
        (area.clientWidth / 2 - 38) + "px";

    winningBall.element.style.top =
        (area.clientHeight / 2 - 38) + "px";


    setTimeout(() => {

        area.style.display = "none";

        document.getElementById("result").style.display = "block";

        document.getElementById("pickNumber").textContent =
            "Pick " + (currentPick + 1);

        document.getElementById("winner").textContent =
            winnerName;


        if (
            currentPick <
            predeterminedOrder.length - 1
        ) {

            document.getElementById("nextButton").style.display =
                "inline-block";

        } else {

            document.getElementById("nextButton").style.display =
                "none";

            setTimeout(showComplete, 2500);

        }

    }, 1000);
}


/*
====================================================
NEXT PICK
====================================================
*/

function nextPick() {

    const winnerName =
        predeterminedOrder[currentPick];

    remainingPlayers =
        remainingPlayers.filter(
            player => player !== winnerName
        );

    currentPick++;

    document.getElementById("result").style.display = "none";

    createBalls();
}


/*
====================================================
SHOW FINAL ORDER
====================================================
*/

function showComplete() {

    document.getElementById("result").style.display = "none";

    document.getElementById("complete").style.display = "block";

    const finalOrder =
        document.getElementById("finalOrder");

    finalOrder.innerHTML = "";

    predeterminedOrder.forEach((name, index) => {

        const row =
            document.createElement("div");

        row.className = "pick";

        row.textContent =
            (index + 1) + ". " + name;

        finalOrder.appendChild(row);

    });
}


/*
====================================================
RESET
====================================================
*/

function resetDraft() {

    clearInterval(animationTimer);

    clearTimeout(drawTimeout);

    balls = [];

    remainingPlayers = [];

    currentPick = 0;

    document.getElementById("ballArea").innerHTML = "";

    document.getElementById("ballArea").style.display = "block";

    document.getElementById("result").style.display = "none";

    document.getElementById("complete").style.display = "none";

    document.getElementById("nextButton").style.display = "none";

    document.getElementById("startScreen").style.display = "block";

    document.getElementById("game").style.display = "none";
}

</script>

</body>
</html>
